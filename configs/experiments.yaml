        peak: 1.5
        slope: 0.8
        boundary_trajectory: 1.5
        morphology: 0.5
        peak_timing: 0.5
        core_derived_trajectory: 0.5
        core_derived_morphology: 0.4
        core_derived_slope: 0.2
        core_derived_peak: 0.3
        core_derived_peak_timing: 0.2
        gas_exchange_log_ratio: 1.0
        rer_slope: 0.5
        gas_exchange_transition: 1.5
      watch_channels:
      - HR
      - HR_smooth
      - HR_slope
      - HR_acceleration
      - HR_rolling_std
      - HR_reserve_pct
      - signal_quality
      - SpO2
      - Bf
