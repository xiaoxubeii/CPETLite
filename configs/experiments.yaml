schema_version: 2
shared_parameters:
  training:
    split_path: null
    normalization_stats_path: null
    require_frozen_normalization: true
    require_supervision_policy: true
    output_dir: ${run.output_dir}
    feature_columns:
    - Time
    - Load_Phase
    - Bf
    - VT
    - VE
    - VO2
    - VO2_kg
    - VCO2
    - VCO2_kg
    - RER
    - VE_VO2
    - VE_VCO2
    - METS
    - HR
    - VO2_HR
    - SpO2
    - PetO2
    - PetCO2
    - Power_Load
    - RPM
    max_len: 192
    limit_exams: null
    batch_size: 64
    learning_rate: 0.0005
    d_model: 192
    n_heads: 6
    n_layers: 6
    dropout: 0.1
    seed: 42
  control_evaluation:
    source_h5: ${controls.source_h5}
    input_format: v5_derivative_split
    split_path: null
    normalization_stats_path: null
    require_frozen_normalization: true
    require_supervision_policy: true
parameter_sets:
  teacher.train:
    base: training
    overrides:
      source_h5: ${principal.source_h5}
      manifest_path: ${principal.manifest}
      architecture: protocol_direct_transformer
      protocol_feature_columns:
      - Time
      - Load_Phase
      - Power_Load
      - RPM
      metadata_columns:
      - Age
      - Height_cm
      - Weight_kg
      epochs: 30
      sde_dt: 0.05
      sde_noise_scale: 0.01
      teacher_input_mode: full
      input_format: v5_derivative_split
      evaluation_split_name: val
  teacher.export:
