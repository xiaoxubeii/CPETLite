    overrides:
      source_h5: ${principal.source_h5}
      architecture: wearable_student
      teacher_checkpoint: ${principal.teacher_checkpoint}
      input_boundary: enhanced
      workout_scenario: power_bike_ergometer
      rollout_type: direct
      sde_dt: 1.0
      sde_noise_scale: 0.08
      future_sample_count: 0
      action_future_sample_count: 0
      task_mode: full_reconstruction
      deterministic_derived_channels: true
      joint_gas_exchange_decoder: true
      base_output_feature_columns:
      - VO2
      - VCO2
      - VE
      - HR
      - PetO2
      - PetCO2
      derived_min_vo2: 50.0
      derived_min_vco2: 50.0
      derived_min_hr: 30.0
      rer_denominator_soft_scale: 150.0
      gas_exchange_at_bandwidth: 0.1
      gas_exchange_at_weight: 2.0
      gas_exchange_post_at_weight: 2.0
      core_at_bandwidth: 0.12
      core_at_weight: 1.0
      core_post_at_weight: 0.5
      initial_anchor_steps: 8
      initial_boundary_steps: 8
      peak_timing_beta: 10.0
      online_safe_training: false
      target_feature_columns:
      - VO2
      - VO2_kg
      - VCO2
      - VCO2_kg
      - VE
      - RER
      - VE_VO2
      - VE_VCO2
      - METS
      - HR
      - VO2_HR
      - PetO2
      - PetCO2
